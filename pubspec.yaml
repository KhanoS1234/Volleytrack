name: volleytrack
description: AI-powered volleyball player tracking app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  google_mlkit_pose_detection: ^0.10.0
  google_mlkit_text_recognition: ^0.11.0
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  share_plus: ^7.2.2
  csv: ^6.0.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
